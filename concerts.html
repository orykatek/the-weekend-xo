<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Koncerty | The Weeknd XO</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<header class="site-header">
    <div class="logo"><a href="index.html">XO</a></div>

    <nav class="nav">
        <a href="index.html">Start</a>
        <a href="bio.html">Życiorys</a>
        <a href="concerts.html" class="active">Koncerty</a>
        <a href="gallery.html">Galeria</a>
        <a href="songs.html">Utwory</a>
        <a href="merch.html">Merch</a>
    </nav>
</header>

<main class="page">
    <div class="page-inner">

        <p class="eyebrow">03 / TOUR</p>
        <h1 class="page-title">Koncerty</h1>

        <p class="page-subtitle">
            Archiwum występów The Weeknd. Wybierz państwo i rok, aby szybko znaleźć konkretne koncerty.
        </p>

        <div class="concert-controls">
            <select id="countryFilter" class="concert-select" aria-label="Wybierz państwo">
                <option value="all">Wszystkie państwa</option>
            </select>

            <select id="yearFilter" class="concert-select" aria-label="Wybierz rok">
                <option value="all">Wszystkie lata</option>
            </select>
        </div>

        <section id="concertList" class="concert-list" aria-live="polite"></section>

    </div>
</main>

<div id="xoTransition">
    <div class="xo-mark">XO</div>
</div>

<script>
const concerts = [
    /* 2026 */
    ["2026-07-30","Frankfurt","Deutsche Bank Park","Niemcy"],
    ["2026-07-31","Frankfurt","Deutsche Bank Park","Niemcy"],
    ["2026-08-01","Frankfurt","Deutsche Bank Park","Niemcy"],
    ["2026-08-04","Warszawa","PGE Narodowy","Polska"],
    ["2026-08-05","Warszawa","PGE Narodowy","Polska"],
    ["2026-08-08","Sztokholm","Strawberry Arena","Szwecja"],
    ["2026-08-09","Sztokholm","Strawberry Arena","Szwecja"],
    ["2026-08-10","Sztokholm","Strawberry Arena","Szwecja"],
    ["2026-08-14","Londyn","Wembley Stadium","Wielka Brytania"],
    ["2026-08-15","Londyn","Wembley Stadium","Wielka Brytania"],
    ["2026-08-16","Londyn","Wembley Stadium","Wielka Brytania"],
    ["2026-08-18","Londyn","Wembley Stadium","Wielka Brytania"],
    ["2026-08-19","Londyn","Wembley Stadium","Wielka Brytania"],
    ["2026-08-22","Dublin","Croke Park","Irlandia"],
    ["2026-08-23","Dublin","Croke Park","Irlandia"],
    ["2026-08-28","Madryt","Riyadh Air Metropolitano","Hiszpania"],
    ["2026-08-29","Madryt","Riyadh Air Metropolitano","Hiszpania"],
    ["2026-08-30","Madryt","Riyadh Air Metropolitano","Hiszpania"],
    ["2026-09-01","Barcelona","Estadi Olímpic Lluís Companys","Hiszpania"],
    ["2026-09-05","Lizbona","Estadio do Restelo","Portugalia"],
    ["2026-09-06","Lizbona","Estadio do Restelo","Portugalia"],
    ["2026-09-19","Tokio","Belluna Dome","Japonia"],
    ["2026-09-20","Tokio","Belluna Dome","Japonia"],
    ["2026-09-26","Dżakarta","Jakarta International Stadium","Indonezja"],
    ["2026-09-27","Dżakarta","Jakarta International Stadium","Indonezja"],
    ["2026-10-02","Singapur","National Stadium","Singapur"],
    ["2026-10-03","Singapur","National Stadium","Singapur"],
    ["2026-10-07","Seul","Goyang Stadium","Korea Południowa"],
    ["2026-10-08","Seul","Goyang Stadium","Korea Południowa"],
    ["2026-10-11","Bangkok","Rajamangala Stadium","Tajlandia"],
    ["2026-10-12","Bangkok","Rajamangala Stadium","Tajlandia"],
    ["2026-10-13","Bangkok","Rajamangala Stadium","Tajlandia"],
    ["2026-10-24","Hongkong","Kai Tak Stadium","Hongkong"],
    ["2026-10-25","Hongkong","Kai Tak Stadium","Hongkong"],
    ["2026-10-30","Hongkong","Kai Tak Stadium","Hongkong"],
    ["2026-10-31","Hongkong","Kai Tak Stadium","Hongkong"],
    ["2026-11-04","Kuala Lumpur","TM Stadium Nasional","Malezja"],
    ["2026-11-05","Kuala Lumpur","TM Stadium Nasional","Malezja"],

    /* przykładowe wpisy archiwalne, aby filtr lat działał również dla wcześniejszych lat */
    ["2025-05-16","São Paulo","Estádio do Morumbi","Brazylia"],
    ["2025-05-17","São Paulo","Estádio do Morumbi","Brazylia"],
    ["2025-06-20","Manchester","Etihad Stadium","Wielka Brytania"],
    ["2025-06-21","Manchester","Etihad Stadium","Wielka Brytania"],
    ["2025-07-04","Amsterdam","Johan Cruijff ArenA","Holandia"],
    ["2025-07-05","Amsterdam","Johan Cruijff ArenA","Holandia"],
    ["2024-09-07","São Paulo","Estádio do Morumbi","Brazylia"],
    ["2024-09-08","São Paulo","Estádio do Morumbi","Brazylia"],
    ["2023-07-01","Toronto","Rogers Centre","Kanada"],
    ["2023-07-02","Toronto","Rogers Centre","Kanada"],
    ["2022-07-08","London","Hyde Park","Wielka Brytania"],
    ["2022-07-09","London","Hyde Park","Wielka Brytania"],
    ["2021-08-07","Las Vegas","Allegiant Stadium","USA"],
    ["2020-01-01","Dublin","3Arena","Irlandia"],
    ["2019-11-24","Abu Dhabi","Yasalam After-Race Concert","ZEA"],
    ["2018-12-13","Tokyo","Shinkiba Studio Coast","Japonia"],
    ["2017-02-17","Brisbane","Brisbane Entertainment Centre","Australia"],
    ["2016-11-10","Melbourne","Rod Laver Arena","Australia"],
    ["2015-11-19","Toronto","Air Canada Centre","Kanada"],
    ["2014-10-03","Toronto","Massey Hall","Kanada"],
    ["2013-09-20","Toronto","The Mod Club","Kanada"],
    ["2012-11-30","Toronto","Opera House","Kanada"],
    ["2011-12-16","Toronto","The Hoxton","Kanada"]
];

const today = new Date("2026-08-08T12:00:00");

const countryFilter = document.getElementById("countryFilter");
const yearFilter = document.getElementById("yearFilter");
const concertList = document.getElementById("concertList");

const countries = [...new Set(concerts.map(c => c[3]))].sort((a,b) => a.localeCompare(b, "pl"));
const years = [...new Set(concerts.map(c => c[0].slice(0,4)))].sort((a,b) => b.localeCompare(a));

countries.forEach(country => {
    const option = document.createElement("option");
    option.value = country;
    option.textContent = country;
    countryFilter.appendChild(option);
});

years.forEach(year => {
    const option = document.createElement("option");
    option.value = year;
    option.textContent = year;
    yearFilter.appendChild(option);
});

function getStatus(dateString) {
    const date = new Date(dateString + "T12:00:00");

    if (date.getTime() === today.getTime()) {
        return ["Dzisiaj", "today"];
    }

    if (date < today) {
        return ["Odbył się", ""];
    }

    return ["Nadchodzący", "upcoming"];
}

function formatDate(dateString) {
    const [year, month, day] = dateString.split("-");
    return `${day}.${month}.${year}`;
}

function renderConcerts() {
    const country = countryFilter.value;
    const year = yearFilter.value;

    const filtered = concerts
        .filter(c => country === "all" || c[3] === country)
        .filter(c => year === "all" || c[0].slice(0,4) === year)
        .sort((a,b) => a[0].localeCompare(b[0]));

    concertList.innerHTML = "";

    if (!filtered.length) {
        concertList.innerHTML = '<div class="empty-state">Brak koncertów dla wybranych filtrów.</div>';
        return;
    }

    filtered.forEach(concert => {
        const [date, city, venue, countryName] = concert;
        const [status, statusClass] = getStatus(date);

        const item = document.createElement("article");
        item.className = "concert-item";

        item.innerHTML = `
            <div class="concert-date">${formatDate(date)}</div>

            <div>
                <div class="concert-city">${city}</div>
                <div class="concert-venue">${venue}</div>
                <div class="concert-country">${countryName}</div>
            </div>

            <div class="concert-status ${statusClass}">${status}</div>
        `;

        concertList.appendChild(item);
    });
}

countryFilter.addEventListener("change", renderConcerts);
yearFilter.addEventListener("change", renderConcerts);

renderConcerts();

/* XO przejście dla menu */
document.querySelectorAll(".nav a").forEach(link => {
    link.addEventListener("click", function(event) {
        const href = this.getAttribute("href");

        if (!href || href.startsWith("#") || href === window.location.pathname.split("/").pop()) {
            return;
        }

        event.preventDefault();

        const overlay = document.getElementById("xoTransition");
        overlay.classList.add("active");

        setTimeout(() => {
            window.location.href = href;
        }, 650);
    });
});
</script>

</body>
</html>
